<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout (~{::body},'beers')}">

<body>

<h2>Beer Information</h2>

<!-- ✅ main info table -->
<div class="table-responsive">
    <table class="table table-striped table-hover" th:object="${beer}">
        <tbody>
        <tr>
            <th>Name</th>
            <td><strong th:text="*{beerName}"></strong></td>
        </tr>
        <tr>
            <th>Style</th>
            <td th:text="*{beerStyle}"></td>
        </tr>
        <tr>
            <th>Price</th>
            <td th:text="*{price}"></td>
        </tr>
        <tr>
            <th>Min on Hand</th>
            <td th:text="*{minOnHand}"></td>
        </tr>
        <tr>
            <th>Quantity to Brew</th>
            <td th:text="*{quantityToBrew}"></td>
        </tr>
        </tbody>
    </table>
</div>

<!-- ✅ button -->
<a th:href="@{{id}/edit(id=${beer.id})}"
   class="btn btn-primary">
    Edit Beer
</a>

<br><br><br>

<h2>Beer Inventory</h2>

<!-- ✅ replace dl-horizontal -->
<div class="card">
    <div class="card-body">

        <div th:each="beerInventory : ${beer.beerInventory}" class="mb-3">

            <dl class="row mb-0">
                <dt class="col-sm-4">Quantity on Hand</dt>
                <dd class="col-sm-8"
                    th:text="${beerInventory.quantityOnHand}"></dd>
            </dl>

        </div>

    </div>
</div>

</body>
</html>
