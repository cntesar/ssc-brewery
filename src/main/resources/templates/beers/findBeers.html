<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout (~{::body}, 'beers')}">

<body>

<h2>Find Beers</h2>

<form th:object="${beer}"
      th:action="@{/beers}"
      method="get"
      id="search-owner-form">

    <div class="mb-3">

        <!-- ✅ label -->
        <label class="form-label">Beer name</label>

        <!-- ✅ input -->
        <input class="form-control"
               th:field="*{beerName}"
               size="30"
               maxlength="80"/>

        <!-- ✅ validation messages -->
        <div th:if="${#fields.hasAnyErrors()}" class="text-danger mt-1">
            <p th:each="err : ${#fields.allErrors()}"
               th:text="${err}">
                Error
            </p>
        </div>

    </div>

    <!-- ✅ submit button -->
    <button type="submit" class="btn btn-primary">
        Find Beer
    </button>

</form>

<br/>

<!-- ✅ action button -->
<a class="btn btn-secondary" th:href="@{/beers/new}">
    Add Beer
</a>

</body>
</html>
