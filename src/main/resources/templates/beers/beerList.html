<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout (~{::body}, 'beers')}">

<body>

<h2>Beers</h2>

<div class="table-responsive">
    <table id="beers" class="table table-striped table-hover">

        <thead>
        <tr>
            <th style="width:150px;">Name</th>
            <th style="width:200px;">Style</th>
            <th>Price</th>
            <th style="width:120px;">Min on Hand</th>
            <th style="width:120px;">Quantity to Brew</th>
            <th>Inventory Quantity on Hand</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="beer : ${selections}">
            <td>
                <a th:href="@{/beers/__${beer.id}__}"
                   th:text="${beer.beerName}">
                </a>
            </td>

            <td th:text="${beer.beerStyle}"></td>
            <td th:text="${beer.price}"></td>
            <td th:text="${beer.minOnHand}"></td>
            <td th:text="${beer.quantityToBrew}"></td>

            <td>
                <span th:each="beerInventory : ${beer.beerInventory}"
                      class="badge bg-primary me-1"
                      th:text="${beerInventory.quantityOnHand}">
                </span>
            </td>
        </tr>
        </tbody>

    </table>
</div>

</body>
</html>
