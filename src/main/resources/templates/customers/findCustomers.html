<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout (~{::body},'customers')}">

<body>

<h2>Find Customers</h2>

<form th:object="${customer}"
      th:action="@{/customers}"
      method="get">

    <!-- ✅ proper form group -->
    <div class="mb-3">
        <label class="form-label">Customer name</label>

        <input class="form-control"
               th:field="*{customerName}"
               size="30"
               maxlength="80"/>

        <!-- ✅ error display -->
        <div th:if="${#fields.hasAnyErrors()}" class="text-danger mt-1">
            <p th:each="err : ${#fields.allErrors()}" th:text="${err}"></p>
        </div>
    </div>

    <!-- ✅ button -->
    <button type="submit" class="btn btn-primary">
        Find Customer
    </button>

</form>

<br/>

<a class="btn btn-secondary" th:href="@{/customers/new}">
    Register Customer
</a>

</body>
</html>
