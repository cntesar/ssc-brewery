<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout (~{::body},'customers')}">

<body>

<h2>Customer Information</h2>

<table class="table table-striped" th:object="${customer}">
    <tr>
        <th>Name</th>
        <td><strong th:text="*{customerName}"></strong></td>
    </tr>

    <tr>
        <th>Registered On</th>
        <td th:text="*{createdDate}"></td>
        <!-- optional formatting -->
        <!-- <td th:text="${#dates.format(customer.createdDate, 'dd-MMM-yyyy')}"></td> -->
    </tr>
</table>

<!-- ✅ Bootstrap 5 button -->
<a th:href="@{{id}/edit(id=${customer.id})}"
   class="btn btn-primary">
    Edit Customer
</a>

</body>
</html>
