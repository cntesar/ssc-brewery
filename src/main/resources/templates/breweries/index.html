<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'beers')}">

<head>
    <meta charset="UTF-8">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}"/>
    <link rel="stylesheet"
          th:href="@{/css/header.css}"/>
    <link rel="stylesheet"
          th:href="@{/css/responsive.css}"/>
    <link rel="stylesheet"
          th:href="@{/css/typography.css}"/>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>


    <title>Brewery</title>
</head>

<body>
<h1>My Breweries!</h1>
<table>
    <tr>
        <th>Name</th>
    </tr>
    <tr th:each="brewery : ${breweries}">
        <td th:text="${brewery.breweryName}">Brewery Name</td>
    </tr>
</table>
</body>
</html>
