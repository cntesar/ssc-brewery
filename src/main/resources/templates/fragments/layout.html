<!doctype html>
<html th:fragment="layout (template, menu)" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="shortcut icon" th:href="@{/images/favicon.png}">

    <title>SFG Beer Works</title>

    <!-- ✅ Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- ✅ Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Your styles -->
    <link rel="stylesheet" th:href="@{/css/brewery.css}"/>
    <link rel="stylesheet" th:href="@{/css/header.css}"/>
    <link rel="stylesheet" th:href="@{/css/responsive.css}"/>
    <link rel="stylesheet" th:href="@{/css/typography.css}"/>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">

        <!-- Toggle button (mobile) -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-navbar">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="main-navbar">
            <ul class="navbar-nav ms-auto">

                <!-- ✅ fragment updated -->
                <li th:fragment="menuItem (path,active,title,icon,text)"
                    class="nav-item"
                    th:classappend="${active==menu ? ' active' : ''}">

                    <a class="nav-link" th:href="@{__${path}__}" th:title="${title}">
                        <i th:class="'bi bi-'+${icon}"></i>
                        <span th:text="${text}">Template</span>
                    </a>
                </li>

                <!-- menu items -->

                <li th:replace="::menuItem ('/','home','home page','house','Home')"></li>

                <li th:replace="::menuItem ('/customers/find','customers','find customers','search','Customers')"></li>

                <li th:replace="::menuItem ('/beers/find','beers','find beers','search','Find beers')"></li>

                <li th:replace="::menuItem ('/brewery/breweries','breweries','breweries','list','Breweries')"></li>

            </ul>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <div class="container xd-container">

        <th:block th:include="${template}"/>

        <br><br>

        <div class="container">
            <div class="row">
                <div class="col-12 text-center">
                    Spring Framework Guru 2020
                </div>
            </div>
        </div>

    </div>
</div>

<!-- ✅ Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
