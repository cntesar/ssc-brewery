<html>
<body>
<form>

    <th:block th:fragment="select (label, name, items)">

        <div class="mb-3"
             th:with="valid=${!#fields.hasErrors(name)}">

            <!-- ✅ label -->
            <label class="form-label" th:text="${label}">Label</label>

            <!-- ✅ select -->
            <select class="form-select"
                    th:field="*{__${name}__}"
                    th:classappend="${valid} ? ' is-valid' : ' is-invalid'">

                <option th:each="item : ${items}"
                        th:value="${item}"
                        th:text="${item}">
                    option
                </option>

            </select>

            <!-- ✅ validation feedback -->
            <div th:if="${valid}" class="valid-feedback">
                Looks good!
            </div>

            <div th:if="${!valid}"
                 class="invalid-feedback d-block"
                 th:errors="*{__${name}__}">
                Error
            </div>

        </div>

    </th:block>

</form>
</body>
</html>
