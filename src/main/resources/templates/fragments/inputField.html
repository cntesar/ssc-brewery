<html>
<body>
<form>

    <th:block th:fragment="input (label, name, type)">

        <div class="mb-3"
             th:with="valid=${!#fields.hasErrors(name)}">

            <!-- ✅ label -->
            <label class="form-label" th:text="${label}">Label</label>

            <!-- ✅ input -->
            <div th:switch="${type}">
                <input th:case="'text'"
                       class="form-control"
                       type="text"
                       th:field="*{__${name}__}"/>

                <input th:case="'number'"
                       class="form-control"
                       type="text"
                       th:field="*{__${name}__}"
                       pattern="^[1-9]\d*$"/>

                <input th:case="'monetory'"
                       class="form-control"
                       type="text"
                       th:field="*{__${name}__}"
                       pattern="[0-9]+(\.[0-9][0-9]?)?"/>

                <input th:case="'date'"
                       class="form-control"
                       type="text"
                       th:field="*{__${name}__}"
                       placeholder="YYYY-MM-DD"
                       title="Enter a date in this format: YYYY-MM-DD"
                       pattern="(?:19|20)[0-9]{2}-(?:(?:0[1-9]|1[0-2])-(?:0[1-9]|1[0-9]|2[0-9])|(?:(?!02)(?:0[1-9]|1[0-2])-(?:30))|(?:(?:0[13578]|1[02])-31))"/>
            </div>

            <!-- ✅ validation feedback -->
            <div th:if="${valid}" class="valid-feedback">
                Looks good!
            </div>

            <div th:if="${!valid}" class="invalid-feedback d-block"
                 th:errors="*{__${name}__}">
                Error
            </div>

        </div>

    </th:block>

</form>
</body>
</html>
